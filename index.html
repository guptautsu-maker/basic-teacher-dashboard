<!DOCTYPE html>
<html lang="hi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Basic Teacher Dashboard</title>
  <meta name="description" content="All-in-one dashboard for basic teachers in India. Access government portals, live notices, school sheets (MDM, attendance, results), WhatsApp & YouTube hubs, and daily tools." />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Basic Teacher Dashboard" />
  <meta property="og:description" content="All-in-one dashboard for basic teachers in India. Access government portals, live notices, school sheets (MDM, attendance, results), WhatsApp & YouTube hubs, and daily tools." />
  <meta name="theme-color" content="#0D5B49" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0A0E27" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TeacherHub" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet" />
  <script>
    (function(){
      try {
        var s = localStorage.getItem('btd-theme');
        var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = (s === 'dark' || s === 'light') ? s : (d ? 'dark' : 'light');
        var root = document.documentElement;
        root.setAttribute('data-theme', t);
        root.classList.toggle('dark', t === 'dark');
        root.classList.toggle('light', t === 'light');
        root.style.colorScheme = t;
      } catch(e) {}
    })();

    // Auto-recovery fallback for static hosts (e.g. Cloudflare Pages serving root '/' directly without Vite transform)
    window.__loadStaticFallback = function() {
      if (window.__STATIC_FALLBACK_LOADED__ || window.__APP_MOUNTED__) return;
      window.__STATIC_FALLBACK_LOADED__ = true;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/static-build/app.css';
      document.head.appendChild(link);

      var script = document.createElement('script');
      script.type = 'module';
      script.src = '/static-build/app.js';
      document.body.appendChild(script);
    };

    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (!window.__APP_MOUNTED__ && (!root || !root.hasChildNodes())) {
          window.__loadStaticFallback();
        }
      }, 900);
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx" onerror="window.__loadStaticFallback && window.__loadStaticFallback()"></script>
</body>
</html>
