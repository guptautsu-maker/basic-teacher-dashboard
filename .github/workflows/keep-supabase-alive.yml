name: Keep Supabase Projects Active

on:
  schedule:
    # Runs daily at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Project 1 REST API
        run: |
          curl --fail --silent --show-error --location \
            --request GET "https://YOUR_PROJECT_URL_1.supabase.co/rest/v1/" \
            --header "apikey: YOUR_ANON_KEY_1" \
            --header "Authorization: Bearer YOUR_ANON_KEY_1"

      - name: Ping Supabase Project 2 REST API
        run: |
          curl --fail --silent --show-error --location \
            --request GET "https://YOUR_PROJECT_URL_2.supabase.co/rest/v1/" \
            --header "apikey: YOUR_ANON_KEY_2" \
            --header "Authorization: Bearer YOUR_ANON_KEY_2"
